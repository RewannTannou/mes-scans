<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Scans</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>📚 Mes Scans</h1>
    <div class="topbar-actions">
      <button id="btn-stats" class="ghost">📊 Stats</button>
      <button id="btn-export" class="ghost" title="Télécharger une sauvegarde">Exporter</button>
      <label class="ghost button" title="Restaurer une sauvegarde">
        Importer<input type="file" id="input-import" accept="application/json" hidden>
      </label>
      <button id="btn-add" class="primary">+ Ajouter un scan</button>
    </div>
  </header>

  <nav class="views" id="views">
    <button data-view="library" class="active">📚 Bibliothèque</button>
    <button data-view="releases">🆕 Dernières sorties <span id="releases-count" class="view-count" hidden></span></button>
  </nav>

  <section class="toolbar check-bar">
    <button id="btn-check" class="ghost">🔄 Vérifier les sorties</button>
    <span id="last-check" class="muted-small"></span>
    <span class="spacer"></span>
    <label class="toggle"><input type="checkbox" id="notify"> 🔔 Me prévenir des nouveaux chapitres</label>
    <label class="toggle" title="Un fichier dans Téléchargements/MesScans chaque semaine"><input type="checkbox" id="backup"> 💾 Sauvegarde auto</label>
  </section>

  <div id="view-library">
  <section class="toolbar">
    <input type="search" id="search" placeholder="Rechercher un titre…">
    <select id="filter-site"><option value="">Tous les sites</option></select>
    <button id="btn-rename-site" class="ghost" hidden title="Le site a changé d'adresse ? Mets à jour tous ses liens">✏️ Changer le domaine</button>
    <select id="sort">
      <option value="lastRead">Lu récemment</option>
      <option value="title">Titre (A→Z)</option>
      <option value="added">Ajout récent</option>
      <option value="unread">Chapitres à lire</option>
    </select>
  </section>

  <section id="resume" class="resume" hidden>
    <h2>Reprendre la lecture</h2>
    <div id="resume-row" class="resume-row"></div>
  </section>

  <nav class="tabs" id="tabs"></nav>

  <main id="grid" class="grid"></main>
  <p id="empty" class="empty" hidden>Aucun scan ici pour l'instant. Clique sur <b>+ Ajouter un scan</b> pour commencer.</p>
  </div>

  <!-- Dernières sorties : journal des nouveaux chapitres détectés -->
  <section id="view-releases" hidden>
    <div class="toolbar releases-bar">
      <div class="segmented" id="release-layout">
        <button data-layout="list" class="active">☰ Liste</button>
        <button data-layout="catalog">▦ Catalogue</button>
      </div>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="hide-read"> Masquer les chapitres déjà lus</label>
    </div>
    <div id="releases"></div>
  </section>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h2 id="form-title">Ajouter un scan</h2>
      <label>Titre *
        <input name="title" required autocomplete="off">
      </label>
      <label>Lien du chapitre que tu lis
        <input name="url" type="url" placeholder="https://site.com/manga/one-piece/chapitre-1100">
        <small id="url-hint" class="hint"></small>
      </label>
      <label>Autres sites où tu le lis (un lien par ligne)
        <textarea name="altUrls" rows="2" placeholder="https://autre-site.com/manga/…/chapitre/12"></textarea>
        <small class="hint warn">« Lire » ouvre le dernier site où tu as lu ; les nouveautés sont cherchées sur tous.</small>
      </label>
      <div class="row">
        <label>Chapitre actuel
          <input name="chapter" type="number" step="0.1" min="0" value="1">
        </label>
        <label>Statut
          <select name="status"></select>
        </label>
      </div>
      <label>Image de couverture (URL)
        <input name="cover" type="url" placeholder="Vide = couverture AniList automatique">
      </label>
      <label>Fiche AniList (état de parution)
        <input name="anilist" type="url" placeholder="Trouvée automatiquement à partir du titre">
        <small id="anilist-hint" class="hint warn"></small>
      </label>
      <div class="form-actions">
        <button type="button" id="btn-delete" class="danger" hidden>Supprimer</button>
        <span class="spacer"></span>
        <button type="button" id="btn-cancel" class="ghost">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <dialog id="stats-dialog" class="stats-dialog">
    <div class="stats-head">
      <h2>📊 Statistiques de lecture</h2>
      <button id="btn-stats-close" class="ghost">Fermer</button>
    </div>
    <div id="stats-content"></div>
  </dialog>

  <script src="shared.js"></script>
  <script src="dashboard.js"></script>
  <script src="stats.js"></script>
  <script src="releases.js"></script>
</body>
</html>
