# Publication automatique : quand la version de extension/manifest.json change
# sur main, l'extension est envoyée au store Mozilla (addons.mozilla.org, canal
# « listed ») pour vérification, et une « Release » GitHub garde une trace de la
# version avec son zip. Les utilisateurs reçoivent la mise à jour par le store
# une fois la version validée par Mozilla.
#
# Prérequis (une seule fois) : deux secrets dans Settings > Secrets and variables > Actions
#   AMO_JWT_ISSUER  et  AMO_JWT_SECRET  (clés API de addons.mozilla.org)
#
# Historique : jusqu'à la 2.6.0, l'extension était publiée ici même (canal « unlisted »,
# fichier updates.json). updates.json reste figé sur la 2.6.0 pour que les anciennes
# installations passent aux mises à jour du store.

name: Publication

on:
  push:
    branches: [main]
    paths: [extension/**]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write # créer la release GitHub

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version à publier
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "La version $VERSION est déjà publiée : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clés Mozilla présentes ?
        if: steps.version.outputs.skip != 'true'
        id: keys
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "::warning::Secrets AMO_JWT_ISSUER / AMO_JWT_SECRET absents : publication ignorée."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests
        if: steps.version.outputs.skip != 'true' && steps.keys.outputs.missing != 'true'
        run: npm test

      - name: Envoi au store Mozilla
        if: steps.version.outputs.skip != 'true' && steps.keys.outputs.missing != 'true'
        # --approval-timeout 0 : on n'attend pas la vérification de Mozilla (parfois plusieurs jours)
        run: |
          npx --yes web-ext@latest sign \
            --source-dir extension \
            --artifacts-dir dist \
            --channel listed \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}" \
            --approval-timeout 0

      - name: Release GitHub
        if: steps.version.outputs.skip != 'true' && steps.keys.outputs.missing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.version }}
          npx --yes web-ext@latest build --source-dir extension --artifacts-dir dist --filename "mes-scans-$V.zip" --overwrite-dest
          gh release create "v$V" "dist/mes-scans-$V.zip" \
            --title "Mes Scans $V" \
            --notes "Version envoyée au store Mozilla : elle arrive automatiquement dans Firefox une fois validée. Installation : https://addons.mozilla.org (rechercher « Mes Scans »)." \
            --generate-notes
